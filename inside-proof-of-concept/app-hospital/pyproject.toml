[project]
name = "app-hospital"
version = "0.1.0"
requires-python = ">=3.9,<3.10"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "flask-talisman>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
